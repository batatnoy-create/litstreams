[profile.default]
src = "contracts"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "paris"
optimizer = true
optimizer_runs = 200

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
# Every handler action filters its own preconditions, so any revert from the contract is a real failure.
fail_on_revert = true

[lint]
# The product is time-based by design; LitVM timestamps come from the sequencer (see docs/SECURITY.md).
exclude_lints = ["block-timestamp"]
